
<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" placeholder="seu@email.com" [disabled]="isLoading()">
    </div>

    <div class="form-group">
      <label>Senha:</label>
      <input type="password" [(ngModel)]="password" placeholder="******" [disabled]="isLoading()" (keyup.enter)="login()">
    </div>

    <button (click)="login()" [disabled]="isLoading()" class="btn-login">
      {{ isLoading() ? 'Entrando...' : 'Entrar' }}
    </button>

    <div class="register-link">
      Não tem uma conta?
      <a routerLink="/register">Criar conta</a>
    </div>

    <div *ngIf="message()" class="message">{{ message() }}</div>
  </div>
</div>
